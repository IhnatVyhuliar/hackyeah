[package]
name = "unbox-server"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "unbox shop backend: HTTP API, SQLite, media; PAYMENTS=solana mirrors the unbox_escrow program"

# Samodzielny crate: pusty [workspace] odcina go od root workspace'u Cargo (programs/*).
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "unbox-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
jsonwebtoken = "9"
bcrypt = "0.17"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# On-chain Deal layout, PDA seeds and deadlines come from the program crate itself (no second copy).
unbox_escrow = { path = "../programs/unbox_escrow", features = ["no-entrypoint"] }
anchor-lang = "=1.1.2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
hex = "0.4"
sha2 = "0.10"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
